name: crystal-combine-pdf
version: 1.0.31.2

description: |
  ISO-compatible Crystal port of the Ruby gem `combine_pdf` v1.0.31
  (April 2025). Provides the canonical `CombinePDF.new` /
  `CombinePDF.load` / `CombinePDF.parse` entry points plus the
  `CombinePDF::PDF` instance API (`<<`, `>>`, `insert`, `remove`,
  `pages`, `page_count`, `new_page`, `title=`, `author=`,
  `number_pages`, `save`, `to_pdf`).

  Crystal-specific bonuses, kept from v0.2 :
  * `CombinePDF.merge`    — one-shot multi-PDF concatenation
  * `CombinePDF.number`   — page numbering with A4/Letter awareness
                            and partition-aware intra-numbering
                            (fixes the US Letter hardcoding bug
                            of the Ruby gem's `number_pages`)
  * `CombinePDF.assemble` — merge + number in a single call
                            (booklet of partitions use case)

  Versioning: 4th digit increments per additive iteration on top of
  the synchronised Ruby gem version.

authors:
  - Philippe Nénert <philippe@aloli.fr>

license: MIT

# Pour le développement local, remplacer par :
#   crystal-pdf:
#     path: ../crystal-pdf
dependencies:
  crystal-pdf:
    github: aloli-crystal/crystal-pdf
    version: "~> 0.3"
  crystal-watermark:
    github: aloli-crystal/crystal-watermark
    version: "~> 0.1"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"

targets:
  crystal-combine-pdf:
    main: src/cli.cr

crystal: ">= 1.19.0"
